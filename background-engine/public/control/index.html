<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEKA Background Engine - Master Control</title>
  <link rel="stylesheet" href="/control/control.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="studio-header">
    <div class="brand-section">
      <div>
        <div class="brand-title">DEKA ENGINE 24/7</div>
        <div class="brand-subtitle">Broadcast Web Graphics & Composer</div>
      </div>
      <div class="device-badge">
        <span class="status-dot" id="device-status-dot"></span>
        <span id="device-label">STUDIO-PC-01</span>
        <span style="color: #64748b;">|</span>
        <span style="color: #10b981;">SESSION ACTIVE</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="btn-mode">MODE: FULL BACKGROUND</button>
      <button class="btn btn-lock" id="btn-lock">🔓 UNLOCKED (CLICK TO LOCK)</button>
      <button class="btn" id="btn-copy-url">📋 COPY VMIX URL</button>
      <button class="btn btn-primary" id="btn-open-output">📺 OPEN PGM OUTPUT</button>
    </div>
  </header>

  <!-- Table Selector Navigation -->
  <nav class="table-nav">
    <button class="table-pill active" data-table="table-01">TABLE 01 (MAIN STUDIO)</button>
    <button class="table-pill" data-table="table-02">TABLE 02 (VIP GAMING)</button>
    <button class="table-pill" data-table="table-03">TABLE 03 (MC CHAT)</button>
    <button class="table-pill" data-table="table-04">TABLE 04 (SPORTS ARENA)</button>
    <button class="table-pill" data-table="table-05">TABLE 05 (BACKUP STAGE)</button>
  </nav>

  <!-- Main Grid -->
  <main class="control-grid">
    <!-- Left Column: Live Preview & Telemetry -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">
            <span>🔴 LIVE PGM PREVIEW (16:9 OUTPUT)</span>
          </div>
          <span class="lock-indicator">🔒 LOCKED FOR BROADCAST</span>
        </div>

        <div class="preview-container">
          <iframe id="preview-frame" src="about:blank"></iframe>
        </div>

        <!-- Telemetry Stats -->
        <div class="telemetry-grid">
          <div class="stat-box">
            <div class="stat-label">RENDER FPS</div>
            <div class="stat-val" id="stat-fps">60</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">ACTIVE LAYERS</div>
            <div class="stat-val" id="stat-layers">7</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">DROPPED FRAMES</div>
            <div class="stat-val" id="stat-dropped" style="color: #10b981;">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">SESSION UPTIME</div>
            <div class="stat-val" id="stat-uptime">0m 0s</div>
          </div>
        </div>
      </div>

      <!-- Quick Broadcast Actions -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">⚡ QUICK BROADCAST ACTIONS</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <button class="btn btn-primary" id="btn-trigger-alert">🚨 TRIGGER ALERT</button>
          <button class="btn" id="btn-clear-alert">🧹 CLEAR ALERT</button>
          <button class="btn" id="btn-reload-all">🔄 REFRESH PREVIEW</button>
        </div>
      </div>
    </div>

    <!-- Right Column: Layers & Inspector -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Layers List Panel -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">📚 COMPOSITOR LAYERS (Z-INDEX)</div>
        </div>
        <div class="layers-list" id="layers-list">
          <!-- Populated by control.js -->
        </div>
      </div>

      <!-- Selected Layer Inspector Form -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">⚙️ LAYER TRANSFORM & INSPECTOR</div>
        </div>
        <div class="inspector-form">
          <div class="form-group full">
            <label class="form-label">LAYER NAME</label>
            <input type="text" id="insp-name" readonly style="opacity: 0.8;">
          </div>

          <div class="form-group">
            <label class="form-label">POSITION X (%)</label>
            <input type="number" id="insp-x" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">POSITION Y (%)</label>
            <input type="number" id="insp-y" step="0.5">
          </div>

          <div class="form-group">
            <label class="form-label">WIDTH (%)</label>
            <input type="number" id="insp-w" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">HEIGHT (%)</label>
            <input type="number" id="insp-h" step="0.5">
          </div>

          <div class="form-group">
            <label class="form-label">SCALE FACTOR</label>
            <input type="number" id="insp-scale" step="0.05" min="0.1" max="3">
          </div>
          <div class="form-group">
            <label class="form-label">OPACITY (0..1)</label>
            <input type="number" id="insp-opacity" step="0.05" min="0" max="1">
          </div>

          <div class="form-group">
            <label class="form-label">BLEND MODE</label>
            <select id="insp-blend">
              <option value="normal">Normal</option>
              <option value="screen">Screen (Light overlay)</option>
              <option value="multiply">Multiply (Dark overlay)</option>
              <option value="overlay">Overlay</option>
            </select>
          </div>

          <div class="form-group full">
            <label class="form-label">SOURCE URL / ENDPOINT</label>
            <input type="text" id="insp-url" placeholder="https://...">
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/control/control.js"></script>
</body>
</html>
