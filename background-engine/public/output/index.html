<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>D-TEK Background Engine - PGM Output</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/output/engine.css">
</head>
<body>
  <!-- Main 16:9 Compositing Canvas -->
  <div id="compositor-stage"></div>

  <!-- Small non-intrusive broadcast badge when in degraded mode -->
  <div id="degraded-badge">● DEGRADED / OFFLINE MODE</div>

  <script src="/output/compositor.js"></script>
  <script src="/output/watchdog.js"></script>
  <script src="/output/wsClient.js"></script>
  <script>
    window.engineStartTime = Date.now();

    // Register Service Worker for 24/7 Asset Caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('[Engine] ServiceWorker registered for offline continuity'))
        .catch((err) => console.warn('[Engine] ServiceWorker registration skipped:', err));
    }

    // Extract tableId from URL path (/output/table-01)
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const tableId = pathParts[1] || 'table-01';

    // Parse Mode Query Param (?mode=transparent)
    const urlParams = new URLSearchParams(window.location.search);
    const queryMode = urlParams.get('mode');

    // Initialize Compositor
    const compositor = new Compositor('compositor-stage');

    // Initialize Autonomous Watchdog
    const watchdog = new ClientWatchdog(compositor);
    window.watchdog = watchdog;

    // Connect to WebSocket Gateway with resilient auto-reconnect
    const wsClient = new ResilientWSClient(
      tableId,
      (msg) => {
        if (msg.type === 'auth:ack' && msg.payload?.scene) {
          const scene = msg.payload.scene;
          if (queryMode) scene.mode = queryMode; // Query param override
          compositor.render(scene);
        } else if (msg.type === 'state:sync' && msg.payload) {
          const scene = msg.payload;
          if (queryMode) scene.mode = queryMode;
          compositor.render(scene);
        } else if (msg.type === 'action:trigger_alert' && msg.payload) {
          if (compositor.scene) {
            const alertLayer = compositor.scene.layers.find(l => l.type === 'alert');
            if (alertLayer) {
              alertLayer.visible = true;
              alertLayer.source.content = msg.payload;
              compositor.render(compositor.scene);
            }
          }
        } else if (msg.type === 'action:clear_alert') {
          if (compositor.scene) {
            const alertLayer = compositor.scene.layers.find(l => l.type === 'alert');
            if (alertLayer) {
              alertLayer.visible = false;
              compositor.render(compositor.scene);
            }
          }
        } else if (msg.type === 'action:reload_layer') {
          if (msg.payload?.layerId) {
            const el = document.getElementById(msg.payload.layerId);
            if (el) {
              const iframe = el.querySelector('iframe');
              if (iframe) iframe.src = iframe.getAttribute('data-src') || iframe.src;
            }
          }
        }
      },
      (status) => {
        if (status === 'degraded') {
          document.body.classList.add('degraded');
        } else {
          document.body.classList.remove('degraded');
        }
      }
    );
  </script>
</body>
</html>
