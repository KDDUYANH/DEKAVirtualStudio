<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dekaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cyber Badge Background -->
  <rect x="5" y="5" width="390" height="110" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#dekaGrad)" stroke-width="2" />

  <!-- DEKA Icon Shape -->
  <polygon points="35,25 75,25 90,60 75,95 35,95 50,60" fill="url(#dekaGrad)" filter="url(#neonGlow)" />
  <polygon points="46,38 68,38 77,60 68,82 46,82 55,60" fill="#07090e" />

  <!-- Text -->
  <text x="110" y="65" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">DEKA</text>
  <text x="110" y="92" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#00f2fe" letter-spacing="6">VIRTUAL STUDIO</text>
  
  <!-- Live Dot -->
  <circle cx="360" cy="35" r="7" fill="#ef4444" />
  <circle cx="360" cy="35" r="12" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="7;16;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="58" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">LIVE</text>
</svg>
