<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1920" height="1080" fill="url(#stageGlow)" />
  
  <!-- Perspective Floor Grid -->
  <rect y="600" width="1920" height="480" fill="url(#cyberGrid)" opacity="0.8" />
  
  <!-- Studio Spotlights & Volumetric Beams -->
  <polygon points="200,0 600,1080 0,1080" fill="url(#beam1)" />
  <polygon points="1720,0 1920,1080 1320,1080" fill="url(#beam2)" />
  
  <!-- Stage Geometric Lines & Accents -->
  <line x1="0" y1="650" x2="1920" y2="650" stroke="rgba(0, 242, 254, 0.2)" stroke-width="2" />
  <line x1="0" y1="900" x2="1920" y2="900" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" />
  
  <!-- Ambient Center Ring -->
  <ellipse cx="960" cy="720" rx="600" ry="180" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="3" stroke-dasharray="20 15" />
  <ellipse cx="960" cy="720" rx="400" ry="120" fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="2" />

  <!-- Studio Header Arch -->
  <path d="M 200,0 Q 960,180 1720,0" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="3" />
</svg>
