# Builds DEKA Virtual Studio on a GitHub-hosted Mac — no local Mac needed.
#  1. unit + Metal pipeline tests on the iOS Simulator (Apple-silicon runner → real Metal)
#  2. device build (unsigned) → DEKAVirtualStudio-unsigned.ipa artifact
# Signing/installing on an iPhone: see docs/BUILD.md.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages (HaishinKit + SRTHaishinKit + RTMPHaishinKit)
        run: xcodebuild -resolvePackageDependencies -project DEKAVirtualStudio.xcodeproj -scheme DEKAVirtualStudio

      - name: Unit + Metal tests (Simulator)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild test \
            -project DEKAVirtualStudio.xcodeproj -scheme DEKAVirtualStudio \
            -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test (Case|Suite)|error:|warning:|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Device build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DEKAVirtualStudio.xcodeproj -scheme DEKAVirtualStudio \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build.log | grep -E "error:|warning:|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          echo "Warnings in app sources:"; grep "warning:" build.log | grep "/DEKAVirtualStudio/" | sort -u || true

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry DEKAVirtualStudio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEKAVirtualStudio
          path: |
            DEKAVirtualStudio-unsigned.ipa
            test.log
            build.log
            TestResults.xcresult
          if-no-files-found: warn
